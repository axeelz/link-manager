<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Link not found</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 24px;
        text-align: center;
        background: light-dark(#fff, #000);
        color: light-dark(#0f1419, #e7e9ea);
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      p {
        margin: 12px 0 28px;
        color: light-dark(#536471, #8b9095);
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }
      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: light-dark(#f7f9f9, #16181c);
        color: light-dark(#0f1419, #e7e9ea);
        font:
          0.9em ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
      }
      a {
        padding: 12px 20px;
        border-radius: 999px;
        background: light-dark(#0f1419, #e7e9ea);
        color: light-dark(#fff, #000);
        font-weight: 600;
        text-decoration: none;
        transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      a:active {
        transform: scale(0.96);
      }
      @media (hover: hover) {
        a:hover {
          background: light-dark(#272c30, #d7dbdc);
        }
      }
      a:focus-visible {
        outline: 2px solid #1d9bf0;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: no-preference) {
        body > * {
          animation: enter 800ms cubic-bezier(0.23, 1, 0.32, 1) both;
        }
        p {
          animation-delay: 80ms;
        }
        a {
          animation-delay: 160ms;
        }
      }
      @keyframes enter {
        from {
          opacity: 0;
          translate: 0 8px;
        }
      }
    </style>
  </head>
  <body>
    <h1>This link doesn’t exist</h1>
    <p>Nothing lives at <code>/{code}</code>. It may have been removed or mistyped.</p>
    <a href="https://axeelz.com">Go to axeelz.com</a>
  </body>
</html>
